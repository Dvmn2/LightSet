# LightSetPlugin configuration.
# Invalid values are reported in the console and replaced with the default shown here.

settings:
  # Plugin message language: "ru", "en" or "auto".
  # "auto" uses the player's client locale; the console always gets English.
  language: auto

# Hard limits that protect the server from overload.
limits:
  # Maximum spotlight range, in blocks (1..2048). Default: 320.
  max-range-blocks: 320
  # Maximum full cone angle of a spotlight, in degrees (1..179). Default: 160.
  max-angle-degrees: 160
  # Maximum number of rays per spotlight (1..5000). Default: 400.
  max-rays: 400
  # Maximum number of light blocks held by one source (1..100000). Default: 1024.
  max-blocks-per-source: 1024
  # Maximum number of light blocks on the whole server (1..10000000). Default: 30000.
  max-total-blocks: 30000

# Values given to newly created sources. They can be changed per source with commands.
defaults:
  # Brightness (0..15). Default: 15.
  brightness: 15
  # Full cone angle, in degrees (1..limits.max-angle-degrees). Default: 40.
  angle-degrees: 40
  # Spotlight range, in blocks (1..limits.max-range-blocks). Default: 250.
  range-blocks: 250
  # Rays cast inside the cone (1..limits.max-rays). More rays give a smoother spot
  # but make recalculation heavier. Default: 120.
  rays: 120

# How spotlight brightness fades (0.0 = no fade, 1.0 = fade to zero).
spot:
  # Fade at the maximum range (0.0..1.0). Default: 0.5.
  distance-falloff: 0.5
  # Fade at the edge of the cone (0.0..1.0). Default: 0.5.
  edge-falloff: 0.5

# Light block placement for "strip" and "area" sources.
shapes:
  # Distance between light blocks along a strip, in blocks (1..64). Default: 4.
  strip-spacing-blocks: 4
  # Distance between light blocks inside an area, in blocks (1..64). Default: 6.
  area-spacing-blocks: 6

performance:
  # How many sources may be recalculated (ray tracing) per tick (1..100). Default: 1.
  source-updates-per-tick: 1
  # How many light blocks may be placed or removed per tick (1..100000). Default: 300.
  block-updates-per-tick: 300

# Brightness effects (command /lightset effect).
effects:
  # How often effects are evaluated, in ticks (1..100). Default: 4.
  interval-ticks: 4
  flicker:
    # Lowest brightness multiplier (0.0..1.0). Default: 0.4.
    min: 0.4
    # Chance to pick a new brightness on each evaluation (0.0..1.0). Default: 0.5.
    change-chance: 0.5
  pulse:
    # Length of one pulse, in ticks (4..100000). Default: 60.
    period-ticks: 60
    # Lowest brightness multiplier (0.0..1.0). Default: 0.2.
    min: 0.2
  blink:
    # Time the light stays on, in ticks (1..100000). Default: 20.
    on-ticks: 20
    # Time the light stays off, in ticks (1..100000). Default: 20.
    off-ticks: 20

# Visible particle beam of spotlights. Seen by every player nearby.
beam:
  # Whether new spotlights show the beam (true/false). Default: true.
  enabled-by-default: true
  # How often the beam is redrawn, in ticks (1..200). Default: 5.
  interval-ticks: 5
  # Particles are shown only to players closer than this, in blocks (4.0..512.0). Default: 64.0.
  view-distance-blocks: 64.0
  # Distance between particles along the beam, in blocks (0.5..32.0). Default: 3.0.
  step-blocks: 3.0
  # Particle colour as #RRGGBB. Default: "#FFF4C2".
  color: "#FFF4C2"
  # Particle size (0.1..4.0). Default: 1.0.
  size: 1.0

# Visible model of a source (item_display entity).
model:
  # Whether models are spawned (true/false). Default: true.
  enabled: true
  # Model scale (0.05..16.0). Default: 1.0.
  scale: 1.0
  # View range multiplier, 1.0 = 64 blocks (0.1..16.0). Default: 2.0.
  view-range-multiplier: 2.0
  # Yaw correction of the model, in degrees (-360.0..360.0). Fits a specific item. Default: 0.0.
  yaw-offset-degrees: 0.0
  # Pitch correction of the model, in degrees (-360.0..360.0). Default: 0.0.
  pitch-offset-degrees: 0.0
  # Item shown for each source type. "material" is any item material name;
  # "item-model" is an optional resource pack model as namespace:path (empty = none).
  items:
    spot:
      # Default: SPYGLASS.
      material: SPYGLASS
      # Default: empty (none).
      item-model: ""
    lamp:
      # Default: SEA_LANTERN.
      material: SEA_LANTERN
      # Default: empty (none).
      item-model: ""
    strip:
      # Default: END_ROD.
      material: END_ROD
      # Default: empty (none).
      item-model: ""
    area:
      # Default: SHROOMLIGHT.
      material: SHROOMLIGHT
      # Default: empty (none).
      item-model: ""
